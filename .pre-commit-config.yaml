# Run by prek (https://prek.j178.dev/), a Rust drop-in for pre-commit that reads
# this file unchanged. `task hooks` installs them; `task pre-commit` runs them over
# everything, and CI runs that through `task check`. The local hooks run through uv,
# so ruff, ty, jscpd and pytest are the versions in uv.lock.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # prek runs these with its own built-in Rust implementations rather than
  # cloning the repo and building a Python environment for them.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Catch credentials before they reach a commit, matching the history scan CI
  # runs. Uses .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Validate Taskfile.yml against Task's own JSON schema, so a misspelled key or
  # a wrong type fails here rather than at run time.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-taskfile

  - repo: local
    hooks:
      # check --fix before format, as ruff recommends: a fix can leave code to reformat.
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # ty checks the whole project; a filename subset loses cross-module types.
      # pyproject.toml and uv.lock change what it resolves, so they re-check too.
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: (\.pyi?|^pyproject\.toml|^uv\.lock)$
      # A clone of an unstaged file is still a clone, so it scans everything in
      # scope (a few ms) rather than just what is staged.
      - id: jscpd
        name: jscpd copy-paste check
        entry: uv run jscpd --no-tips --config .jscpd.json
        language: system
        pass_filenames: false
        files: ^(src/|\.jscpd\.json$)
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
