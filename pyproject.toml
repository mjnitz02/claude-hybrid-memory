[project]
name = "claude-hybrid-memory"
version = "0.1.0"
description = "A hybrid memory system for Claude Code: territories, routers, hooks and the mem CLI."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
mem = "claude_hybrid_memory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "pre-commit>=4"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: read-only against the real store on this machine (run with -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
