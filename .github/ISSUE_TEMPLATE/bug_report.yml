name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Keep it as short as it needs to be, and leave
        real memory content out of it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Claude Code version, commit.
      placeholder: "macOS 27, Python 3.13, Claude Code 2.x, commit abc1234"
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Output
      description: "`mem audit` or the failing command's output, with anything private removed."
      render: text
    validations:
      required: false
